<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Khai Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/books/">Khai Bookstore</a>
            <div class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <span class="nav-item nav-link text-light">Hi, {{ user.username }}</span>
                    <a class="nav-item nav-link" href="/cart/">Giỏ hàng</a>
                    <a class="nav-item nav-link" href="/auth/logout/">Logout</a>
                {% else %}
                    <a class="nav-item nav-link" href="/auth/login/">Login</a>
                    <a class="nav-item nav-link" href="/auth/register/">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
