<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khai Bookstore</title>
    <!-- Add Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Add Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <!-- Load Static Tag -->
    {% load static %}
    <!-- Custom CSS -->
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>

<body>
    <!-- Premium Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top mb-4">
        <div class="container">
            <!-- Brand -->
            <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'book_list' %}">
                <i class="bi bi-book-half text-primary fs-3"></i>
                Khai Bookstore
            </a>

            <!-- Mobile Toggle -->
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navbar Links -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto align-items-lg-center gap-2">
                    {% if user.is_authenticated %}
                    <span
                        class="nav-item nav-link d-flex align-items-center gap-2 bg-light rounded-pill px-3 py-2 text-dark fw-medium">
                        <i class="bi bi-person-circle text-muted fs-5"></i>
                        {{ user.username }}
                    </span>

                    <a class="nav-item nav-link d-flex align-items-center gap-1" href="{% url 'cart_detail' %}">
                        <i class="bi bi-cart3 fs-5"></i>
                        Giỏ hàng
                    </a>

                    <a class="btn btn-outline-danger btn-sm ms-lg-2 rounded-pill px-4 fw-medium" href="/auth/logout/">
                        <i class="bi bi-box-arrow-right"></i> Đăng xuất
                    </a>
                    {% else %}
                    <a class="nav-item nav-link fw-medium" href="/auth/login/">Đăng nhập</a>
                    <a class="btn btn-primary rounded-pill px-4 fw-medium shadow-sm" href="/auth/register/">
                        Đăng ký
                    </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mb-5 flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p class="mb-0 fw-medium">© 2026 Khai Bookstore. Premium Book Collection.</p>
        </div>
    </footer>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
